name: BTC Lean AMT daily value map
on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *' # 09:30 Bangkok; may fail if archive not yet published
    - cron: '10 10 * * *' # 17:10 Bangkok retry after publication
permissions:
  contents: write
concurrency:
  group: btc-lean-amt-daily
  cancel-in-progress: false
jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run deterministic unit tests
        run: python -m unittest discover -s tests -v
      - name: Calculate trade-exact prior UTC day profile and VWAP
        run: python calculate.py --output output/latest.json
      - name: Enrich with POC migration and previous weekly trade profile
        run: python enrich.py --input output/latest.json
      - name: Publish versioned JSON
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('output/latest.json'); d=json.loads(p.read_text()); q=pathlib.Path('output')/(d['as_of_closed_day_utc']+'.json');q.write_text(p.read_text())
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/
          if ! git diff --cached --quiet; then git commit -m 'Update BTC Lean AMT value map'; git push; fi


name: BTCUSDT validated intraday snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'calculate_cvd.py'
      - 'validate_outputs.py'
      - 'tests/test_cvd.py'
      - 'tests/test_freshness.py'
      - '.github/workflows/intraday.yml'
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write

concurrency:
  group: btc-lean-amt-intraday-publisher
  cancel-in-progress: false

jobs:
  publish-intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run deterministic unit tests
        run: python -m unittest discover -s tests -v
      - name: Collect synchronized closed-minute data
        run: python calculate_cvd.py --output output/latest_intraday.json
      - name: Validate structure, completeness and source freshness
        run: python validate_outputs.py intraday output/latest_intraday.json --max-age-seconds 1200
      - name: Publish separate intraday JSON on main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/latest_intraday.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update validated BTCUSDT intraday snapshot'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

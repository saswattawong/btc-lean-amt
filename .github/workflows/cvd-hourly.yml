name: Binance Data Vision BTCUSDT CVD

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'calculate_archive_cvd.py'
      - 'publish_outputs.py'
      - 'validate_outputs.py'
      - '.github/workflows/cvd-hourly.yml'
  push:
    branches: [main]
    paths:
      - 'calculate_archive_cvd.py'
      - 'publish_outputs.py'
      - 'validate_outputs.py'
      - '.github/workflows/cvd-hourly.yml'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: btc-lean-amt-output-publisher
  cancel-in-progress: false

jobs:
  publish-cvd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Calculate latest checksum-verified closed-day CVD
        run: python calculate_archive_cvd.py --output output/latest_cvd.json
      - name: Validate archive checksums, integrity and source freshness
        run: python validate_outputs.py archive-cvd output/latest_cvd.json --max-age-seconds 172800
      - name: Publish latest CVD on main
        if: github.ref == 'refs/heads/main'
        run: >-
          python publish_outputs.py
          --message 'Update verified Binance BTCUSDT CVD archive'
          output/latest_cvd.json
